name: "Cache"
on:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  cache-builds:
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      HAS_CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
    - uses: actions/checkout@v7
    - uses: nixbuild/nix-quick-install-action@v30
      with:
        nix_conf: max-jobs = auto
    - uses: cachix/cachix-action@v14
      if: env.HAS_CACHIX_TOKEN == 'true'
      with:
        name: swift-overlay
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build all Swift versions for ${{ matrix.system }}
      run: |
        # Get all available versions from swift_hashes.json
        VERSIONS=$(jq -r 'keys[] | select(. != "latest")' swift_hashes.json)

        # Build each version for the current system
        for version in $VERSIONS; do
          nix build --system ${{ matrix.system }} ".#bin.$version"
        done

        # Build latest
        nix build --system ${{ matrix.system }} ".#default"
